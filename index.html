<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FSCD Forms &amp; Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FSCD Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2f5d8a">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<script defer src="lib/pdf-lib.min.js"></script>
<style>
:root{
  --bg:#f3f4f6; --card:#ffffff; --ink:#0b1220; --muted:#3f4754; --line:#cfd4dc; --soft:#eceff3;
  --doc:#0e9f7e; --doc-soft:#e6f6f1; --resp:#f2711c; --resp-soft:#fff0e6;
  --blue:#3867d6; --blue-soft:#eaf0fc; --violet:#7c5cdb; --violet-soft:#f1edfc;
  --red:#e0483e; --red-soft:#fdeceb; --radius:20px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 120px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button,input,textarea,a{touch-action:manipulation}
svg.ic{width:1em;height:1em;vertical-align:-.14em;flex:none}
.num{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--ink);color:#fff;font-size:.7em;font-weight:700}
/* header */
.top{display:flex;align-items:center;gap:12px;margin:4px 0 20px}
.top h1{font-size:28px;font-weight:750;letter-spacing:-.02em;margin:0;flex:1;display:flex;align-items:center;gap:10px}
.top h1 svg.ic{font-size:26px;color:var(--muted)}
.iconbtn{width:48px;height:48px;border-radius:50%;background:var(--card);font-size:22px;display:grid;place-items:center;box-shadow:var(--shadow);color:var(--ink)}
/* home tiles */
.tiles{display:grid;gap:12px}
.tile{display:flex;align-items:center;gap:16px;padding:18px;border-radius:var(--radius);background:var(--card);text-align:left;box-shadow:var(--shadow)}
.tile .em{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:28px;flex:none}
.tile.doc .em{background:var(--doc-soft);color:var(--doc)} .tile.resp .em{background:var(--resp-soft);color:var(--resp)} .tile.trip .em{background:var(--blue-soft);color:var(--blue)}
.tile .t{font-size:21px;font-weight:700;letter-spacing:-.01em}
.tile .s{font-size:15px;color:var(--muted);margin-top:2px}
.tile::after{content:"›";margin-left:auto;font-size:28px;color:#c3c7cf;font-weight:300}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.start{display:flex;align-items:center;gap:14px;width:100%;background:var(--blue);color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:14px;text-align:left;box-shadow:var(--shadow)}
.start .em{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:26px;flex:none}
.start b{display:block;font-size:22px} .start span span{font-size:17px;opacity:.95} .start .chev{margin-left:auto;font-size:30px}
.mini{background:var(--card);border-radius:var(--radius);padding:16px 6px 14px;text-align:center;font-size:14px;font-weight:600;box-shadow:var(--shadow);position:relative;color:var(--ink)}
.mini .em{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin:0 auto 8px;font-size:22px;background:var(--soft);color:var(--ink)}
.mini:nth-child(1) .em{background:var(--doc-soft);color:var(--doc)} .mini:nth-child(2) .em{background:var(--violet-soft);color:var(--violet)} .mini:nth-child(3) .em{background:#fff6d9;color:#b7860b}
.mini .dot{position:absolute;top:10px;right:12px;background:var(--red);color:#fff;border-radius:999px;font-size:12px;min-width:22px;height:22px;line-height:22px;padding:0 6px;font-weight:700}
/* month switcher */
.month{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:999px;padding:5px;margin-bottom:14px;box-shadow:var(--shadow)}
.month b{font-size:18px;font-weight:700}
.month button{width:46px;height:46px;font-size:24px;border-radius:50%;color:var(--muted)}
.month button:active{background:var(--soft)}
/* lists */
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:14px}
.item{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);width:100%}
.item .em{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--soft);color:var(--muted);flex:none}
.item .main{flex:1;min-width:0}
.item .a{font-size:17px;font-weight:650}
.item .b{font-size:15px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .go{margin-left:auto;font-size:28px;color:#8b93a1;padding:0 4px}
.item .x{width:40px;height:40px;border-radius:50%;font-size:18px;color:#9aa0aa;background:var(--soft);display:grid;place-items:center}
.empty{text-align:center;color:var(--muted);font-size:17px;padding:34px 10px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.empty .em{font-size:40px;display:block;margin-bottom:8px;color:#c3c7cf}
/* buttons */
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;border-radius:18px;font-size:19px;font-weight:700;color:#fff;margin-top:10px;letter-spacing:-.01em}
.big .em{font-size:22px;display:inline-flex}
.big.doc{background:var(--doc)} .big.resp{background:var(--resp)} .big.trip,.big.blue{background:var(--blue)} .big.red{background:var(--red)}
.big.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.big:active{transform:scale(.99);filter:brightness(.96)}
.big[disabled]{opacity:.45}
/* totals */
.total{display:flex;gap:10px;margin-bottom:14px}
.total div{flex:1;background:var(--card)!important;border-radius:18px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.total b{display:block;font-size:26px;font-weight:750;letter-spacing:-.02em}
.total span{font-size:15px;color:var(--muted)}
/* bottom sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(17,24,39,.4);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:#d5d9e0;margin:0 auto 12px}
.sheet h2{font-size:22px;font-weight:750;letter-spacing:-.02em;margin:2px 0 14px;display:flex;align-items:center;gap:10px}
.lab{font-size:15px;font-weight:650;color:var(--muted);margin:16px 0 8px;display:flex;gap:8px;align-items:center}
.lab .em{font-size:17px;display:inline-flex}
input,select,textarea{font:inherit;font-size:18px;width:100%;padding:15px 16px;border-radius:16px;border:1.5px solid transparent;background:var(--card);color:var(--ink);-webkit-appearance:none;appearance:none;box-shadow:inset 0 0 0 1.5px var(--line)}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--blue)}
::placeholder{color:#a3a9b3}
.chips{display:grid;gap:8px}
.chip{background:var(--card);border-radius:16px;padding:14px 16px;text-align:left;font-size:17px;font-weight:650;box-shadow:inset 0 0 0 1.5px var(--line)}
.chip small{display:block;font-weight:400;font-size:15px;color:var(--muted);margin-top:2px}
.chip.on{box-shadow:inset 0 0 0 2.5px var(--doc);background:var(--doc-soft)}
.chip.svc{display:flex;align-items:center;gap:12px}
.chip.svc .tick{width:28px;height:28px;border-radius:8px;box-shadow:inset 0 0 0 2px #8b93a1;display:grid;place-items:center;flex:none;color:#fff;font-size:16px}
.chip.svc.on .tick{background:var(--doc);box-shadow:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:14px}
.seg button{flex:1;padding:12px;border-radius:11px;font-size:17px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
/* setup cards */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 4px;font-size:18px;font-weight:700;display:flex;gap:8px;align-items:center}
.card h3 svg.ic{color:var(--muted)}
.card input,.card select,.card textarea{background:var(--soft);box-shadow:none}
.card input:focus,.card select:focus,.card textarea:focus{box-shadow:inset 0 0 0 2px var(--blue);background:#fff}
.hint{font-size:15px;color:var(--muted)}
.clin{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.clin div{flex:1;font-size:16px}
.clin small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(17,24,39,.92);color:#fff;padding:12px 18px;border-radius:999px;font-size:16px;font-weight:600;z-index:40;display:none;max-width:90vw;text-align:center}
.withcam{display:flex;gap:8px;align-items:stretch}
.withcam input{flex:1;min-width:0}
.cam{flex:none;width:58px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-size:24px;position:relative;display:grid;place-items:center}
.cam.has{box-shadow:inset 0 0 0 2.5px var(--doc);background:var(--doc-soft)}
.cam .cn{position:absolute;top:-7px;right:-7px;background:var(--doc);color:#fff;border-radius:999px;font-size:13px;min-width:22px;height:22px;line-height:22px;font-weight:700;padding:0 5px}
.cam .cn:empty{display:none}
.pbox{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.pth{position:relative;width:92px;height:92px;border-radius:14px;overflow:hidden;background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--line)}
.pth img{width:100%;height:100%;object-fit:cover;display:block}
.pth .pk{position:absolute;left:4px;bottom:4px;background:#fff;border-radius:8px;padding:2px 5px;font-size:16px;line-height:1}
.pth .px{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;background:rgba(17,24,39,.72);color:#fff;font-size:15px}
.pth .gone{display:grid;place-items:center;height:100%;font-size:28px;color:var(--muted)}
.pwarn{background:#fff3d6;color:#7a4b00;border-radius:12px;padding:10px 12px;font-size:16px;font-weight:600;margin-top:8px}
.rbadge{box-shadow:inset 0 0 0 2px var(--red);color:var(--red);border-radius:10px;padding:3px 8px;font-size:14px;font-weight:700;white-space:nowrap;flex:none}
.warn{background:var(--red-soft);color:#9b2c25;border-radius:16px;padding:14px;font-size:16px;margin-bottom:12px}
.ready{background:var(--card);border-radius:var(--radius);padding:20px;text-align:center;font-size:18px;box-shadow:var(--shadow)}
.ready .em{font-size:40px;display:block;margin-bottom:6px;color:var(--doc)}
.ready b{font-size:20px}
.steps{display:flex;justify-content:center;align-items:center;gap:10px;font-size:24px;margin:12px 0 4px;color:var(--muted)}
/* to-do */
.check{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;width:100%;text-align:left;box-shadow:var(--shadow)}
.check .box{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 2px #cfd3da;display:grid;place-items:center;font-size:16px;flex:none;color:#fff}
.check.done .box{background:var(--doc);box-shadow:none}
.check.done .t{text-decoration:line-through;color:var(--muted)}
.check .t{font-size:17px;font-weight:650}
.check .s{font-size:15px;color:var(--muted);margin-top:2px}
.check .em2{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--soft);color:var(--muted);flex:none}
.info{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;display:flex;gap:14px;box-shadow:var(--shadow)}
.info .em{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--soft);color:var(--ink);flex:none}
.info b{font-size:17px;display:block;margin-bottom:2px}
.info div{font-size:15px;line-height:1.4;color:#374151}
/* questions (FAQ) */
.fsearch{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:4px 6px 4px 16px;box-shadow:inset 0 0 0 2px var(--line);margin-bottom:6px}
.fsearch .em{font-size:22px;color:var(--muted);display:grid}
.fsearch input{box-shadow:none;padding:14px 8px;background:transparent}
.fsec-unused{font-size:18px;font-weight:800;margin:20px 4px 8px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.faq{background:var(--card);border-radius:18px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.faq.open{box-shadow:inset 0 0 0 2.5px var(--blue)}
.fq{display:flex;align-items:center;gap:14px;width:100%;padding:14px;text-align:left;color:var(--ink)}
.fq .em{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:var(--blue-soft);color:var(--blue);flex:none}
.fq .qt{flex:1;font-size:20px;font-weight:700;line-height:1.25}
.fq .chev{font-size:28px;color:var(--muted);display:grid}
.fcats{display:grid;gap:12px;margin-top:12px}
.fcat{display:flex;align-items:center;gap:16px;padding:18px;border-radius:var(--radius);background:var(--card);text-align:left;box-shadow:var(--shadow);color:var(--ink)}
.fcat .em{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;font-size:28px;background:var(--blue-soft);color:var(--blue);flex:none}
.fcat .qt{flex:1;font-size:23px;font-weight:750}
.fcat .n{min-width:34px;height:34px;border-radius:17px;background:var(--soft);display:grid;place-items:center;font-size:17px;font-weight:700;color:var(--muted)}
.fcat .chev{font-size:28px;color:var(--muted);display:grid}
#faqList{margin-top:12px}
.fa{padding:0 16px 16px}
.fa p{font-size:22px;line-height:1.4;margin:2px 0 12px;font-weight:600}
.fa .mine{background:var(--doc-soft);color:#065f46;border-radius:14px;padding:12px 14px;font-size:19px;font-weight:700;display:flex;gap:8px;align-items:center}
.fbtns{display:flex;gap:10px}
.fbtns .big{margin-top:10px}
.fbtns .say{width:76px;flex:none}
.pgv{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.pgv canvas{width:100%;height:auto;display:block}
html.xl .fq .qt{font-size:23px} html.xl .fa p{font-size:25px}
/* wizard */
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 18px}
.prog i{display:block;height:100%;background:var(--blue)}
.wq{font-size:24px;font-weight:750;letter-spacing:-.02em;margin:10px 0 14px;display:flex;gap:12px;align-items:center}
.wq .em{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:var(--violet-soft);color:var(--violet);flex:none}
/* progress card */
.fcard{display:flex;gap:14px;background:var(--card);border-radius:var(--radius);padding:12px;margin-bottom:12px;align-items:center;box-shadow:var(--shadow)}
.fthumb{width:96px;min-height:72px;flex:none;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);background:#fff;display:grid;place-items:center;overflow:hidden;position:relative;padding:0;cursor:pointer}
.fthumb canvas{width:100%;height:auto;display:block}
.fthumb .ph{font-size:28px;padding:20px 0;color:#c3c7cf}
.fthumb .zoom{position:absolute;right:4px;bottom:4px;background:rgba(17,24,39,.75);color:#fff;border-radius:8px;font-size:13px;padding:3px 6px;display:grid;place-items:center}
.fside{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.frow{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:600;color:var(--muted)}
.frow span{display:flex;gap:6px;align-items:center}
.frow b{font-size:16px;color:var(--ink)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .3s}
.bar.okb i{background:var(--doc)} .bar.lines i{background:var(--blue)}
.fdone{font-size:15px;color:var(--doc);font-weight:600}
.miss{display:flex;gap:12px;align-items:center;width:100%;background:var(--red-soft);color:#9b2c25;border-radius:16px;padding:12px 14px;font-size:15px;font-weight:650;text-align:left;margin-bottom:12px}
.miss svg.ic{font-size:20px}
/* date/time boxes */
.dtbox{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:12px 16px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-size:18px;font-weight:650;text-align:left;color:var(--ink)}
.dtbox .em{font-size:20px;color:var(--muted);display:inline-flex}
.dtbox .ph{color:#a3a9b3;font-weight:500;font-size:17px}
.dtbox .chev{margin-left:auto;color:#c3c7cf;font-size:22px}
.dtbox.set{box-shadow:inset 0 0 0 2px var(--blue);background:var(--blue-soft)}
.dtbox.set .em{color:var(--blue)}
.row2 .dtbox{font-size:17px;padding:10px 12px;gap:8px;white-space:nowrap} .row2 .dtbox .chev{display:none}
/* pop-up */
.pop-bg{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:14px}
.pop-bg.on{display:flex}
.pop{background:var(--card);width:100%;max-width:420px;border-radius:26px;padding:18px;max-height:94vh;overflow:auto;box-shadow:0 20px 50px rgba(17,24,39,.25)}
.pop h2{font-size:20px;font-weight:750;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.pop .big.ghost{box-shadow:none;background:var(--soft)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-h button.nav{width:46px;height:46px;border-radius:50%;background:var(--soft);font-size:24px}
.cal-h .t{font-size:18px;font-weight:700;padding:8px 12px;border-radius:12px}
.cal-h .t.tap{background:var(--soft)}
.cal-w{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:13px;font-weight:600;color:var(--muted);margin:8px 0}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-g button{aspect-ratio:1/1;border-radius:50%;font-size:17px;font-weight:600;min-height:40px}
.cal-g button:active{background:var(--soft)}
.cal-g button.today{box-shadow:inset 0 0 0 2px var(--blue);color:var(--blue)}
.cal-g button.on{background:var(--blue);color:#fff;box-shadow:none}
.cal-g button:disabled{opacity:.25}
.cal-g .x{visibility:hidden}
.ym{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ym button{min-height:52px;border-radius:14px;background:var(--soft);font-size:17px;font-weight:650}
.ym button.on{background:var(--blue);color:#fff}
.tp-big{text-align:center;font-size:36px;font-weight:750;letter-spacing:-.02em;margin:4px 0 8px}
.tp-sec{font-size:15px;font-weight:650;color:var(--muted);margin:12px 0 6px;display:flex;gap:6px;align-items:center;text-transform:uppercase;letter-spacing:.04em}
.tpg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tpg button{min-height:48px;border-radius:12px;background:var(--soft);font-size:17px;font-weight:650}
.tpg button.on,.tpm button.on{background:var(--blue);color:#fff}
.tpm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tpm button{min-height:52px;border-radius:14px;background:var(--soft);font-size:19px;font-weight:700}
.sg{display:grid;gap:8px}
.sg button{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:16px;padding:12px 14px;min-height:60px;text-align:left}
.sg button .em{width:38px;height:38px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:18px;color:var(--blue);flex:none}
.sg button b{display:block;font-size:17px;font-weight:650}
.sg button small{display:block;font-size:15px;color:var(--muted);margin-top:1px}

function normalize(d){ const b=blank(); const out=Object.assign(b,d||{}); out.settings=Object.assign(blank().settings,(d&&d.settings)||{}); out.settings.worker=Object.assign(blank().settings.worker,out.settings.worker||{}); ["appts","visits","trips"].forEach(k=>{ if(!Array.isArray(out[k])) out[k]=[]; }); { const MAP={"Medical appointment (return trip)":"Medical appt (round trip)","Hospital stay (return trip)":"Hospital stay (round trip)","Medical appt":"Medical appt (round trip)","Hospital stay":"Hospital stay (round trip)"}; out.trips.forEach(t=>{ if(MAP[t.purpose]) t.purpose=MAP[t.purpose]; }); }

const ICON_KEYS=Object.keys(ICONS).sort((a,b)=>b.length-a.length);
const KEYCAP=/([1-9])\uFE0F?\u20E3/g;
function iconSVG(e){ return `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[e]}</svg>`; }
function iconize(root){
  if(!root||root.nodeType!==1&&root.nodeType!==3) return;
  const base=root.nodeType===3?root.parentNode:root; if(!base||!base.isConnected) return;
  const walker=document.createTreeWalker(base,NodeFilter.SHOW_TEXT,{acceptNode:n=>{ const p=n.parentNode; if(!p||/^(TEXTAREA|SCRIPT|STYLE|INPUT|OPTION)$/.test(p.nodeName)) return NodeFilter.FILTER_REJECT; return NodeFilter.FILTER_ACCEPT; }});
  const hits=[]; let n; while((n=walker.nextNode())){ const t=n.nodeValue; if(KEYCAP.test(t)||ICON_KEYS.some(k=>t.includes(k))) hits.push(n); KEYCAP.lastIndex=0; }
  hits.forEach(node=>{
    let html=esc(node.nodeValue).replace(KEYCAP,(m,d)=>`<span class="num">${d}</span>`);
    for(const k of ICON_KEYS){ if(html.includes(k)) html=html.split(k).join(iconSVG(k)); }
    html=html.replace(/\uFE0F/g,"");
    const span=document.createElement("span"); span.innerHTML=html;
    const frag=document.createDocumentFragment(); while(span.firstChild) frag.appendChild(span.firstChild);
    if(node.parentNode) node.parentNode.replaceChild(frag,node);
  });
}
new MutationObserver(ms=>{ for(const m of ms){ m.addedNodes.forEach(x=>iconize(x)); if(m.type==="characterData") iconize(m.target); } }).observe(document.body,{childList:true,subtree:true,characterData:true});

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const pad = n => String(n).padStart(2,"0");
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const nowHM = () => { const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON3 = ["Jan.","Feb.","Mar.","Apr.","May","June","July","Aug.","Sept.","Oct.","Nov.","Dec."];
const DAY3 = ["Sun.","Mon.","Tue.","Wed.","Thu.","Fri.","Sat."];
const parseISO = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const shortDate = s => { const d=parseISO(s); return `${DAY3[d.getDay()]} ${MON3[d.getMonth()]} ${d.getDate()}`; };
const time12 = hm => { if(!hm) return ""; let [h,m]=hm.split(":").map(Number); const ap=h>=12?"PM":"AM"; h=h%12||12; return `${h}:${pad(m)} ${ap}`; };
const hoursOf = v => {
  if (!v.start || !v.end) return 0;
  const [a,b]=v.start.split(":").map(Number), [c,d]=v.end.split(":").map(Number);
  let mins=(c*60+d)-(a*60+b); if (mins<=0) mins+=24*60;
  return Math.round(mins/60*100)/100;
};
const fmtH = h => (Math.round(h*100)/100).toString();
const money = n => "$" + (Math.round(n*100)/100).toFixed(2);
// services: a worker may provide more than one type; each has its own wage and column on the form
const DAYS_SVC="24 Hour Respite";
const svcList=()=>{ const s=data.settings; return (Array.isArray(s.services)&&s.services.length)?s.services:[s.service||"Hourly Respite"]; };
const svcOf=v=>(v&&v.service)||svcList()[0];
const isDaysSvc=sv=>sv===DAYS_SVC;
const visitQty=v=>isDaysSvc(svcOf(v))?(+v.days||0):hoursOf(v);
const wageOf=sv=>{ const w=data.settings.wages||{}; return parseFloat(w[sv])||0; };
const unitOf=sv=>isDaysSvc(sv)?"day":"hr";
const SVC_SHORT={"Hourly Respite":"Respite","Work Related Child Care":"Work child care","Domestic Child Care":"Child care","Homemaking":"Homemaking","Sibling Care":"Sibling care","Community Support Aide":"Community aide","Personal Care Aide Support":"Personal care","Behavioural or Developmental Aide Support":"Behaviour aide","24 Hour Respite":"24 h respite"};
const respTotals=list=>{ let hours=0,days=0,cost=0; list.forEach(v=>{ const sv=svcOf(v), q=visitQty(v); if(isDaysSvc(sv)) days+=q; else hours+=q; cost+=q*wageOf(sv); }); return {hours,days,cost}; };
let month = todayISO().slice(0,7);
const monthLabel = m => { const [y,mm]=m.split("-").map(Number); return `${MONTHS[mm-1]} ${y}`; };
const shiftMonth = (m,k) => { let [y,mm]=m.split("-").map(Number); mm+=k; while(mm<1){mm+=12;y--} while(mm>12){mm-=12;y++} return `${y}-${pad(mm)}`; };
const inMonth = (arr) => arr.filter(x => x.date.slice(0,7)===month).sort((a,b)=>(a.date+(a.time||a.start||"")).localeCompare(b.date+(b.time||b.start||"")));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toast.h); toast.h=setTimeout(()=>t.style.display="none",2600); }
function openSheet(html){ const sh=$("#sheet"); sh.onclick=null; sh.oninput=null; sh.innerHTML=html; $("#sheetBg").classList.add("on"); }
function closeSheet(){ $("#sheetBg").classList.remove("on"); }
$("#sheetBg").addEventListener("click", e => { if (e.target.id==="sheetBg") closeSheet(); });

/* ---------- pop-up calendar + time picker ---------- */
function closePop(){ $("#popBg").classList.remove("on"); $("#pop").onclick=null; }
$("#popBg").addEventListener("click",e=>{ if(e.target.id==="popBg") closePop(); });
// opts: {max:"YYYY-MM-DD", dob:true, title}
function openDatePop(val,onPick,opts={}){
  const t=parseISO(todayISO());
  let cur=val?parseISO(val):(opts.dob?new Date(t.getFullYear()-8,t.getMonth(),1):t);
  let vy=cur.getFullYear(), vm=cur.getMonth(), mode="days";
  const draw=()=>{
    let html=`<h2 style="margin:0 0 10px">📅 ${esc(opts.title||"Pick a day")}</h2>`;
    if(mode==="years"){
      const ys=[]; for(let y=t.getFullYear(); y>=t.getFullYear()-25; y--) ys.push(y);
      html+=`<div class="ym">${ys.map(y=>`<button data-y="${y}" class="${y===vy?"on":""}">${y}</button>`).join("")}</div>`;
    } else if(mode==="months"){
      html+=`<div class="cal-h"><span class="t">${vy}</span></div><div class="ym">${MONTHS.map((m,i)=>`<button data-m="${i}" class="${i===vm?"on":""}">${m.slice(0,3)}</button>`).join("")}</div>`;
    } else {
      const first=new Date(vy,vm,1), dim=new Date(vy,vm+1,0).getDate(), off=first.getDay();
      const ti=todayISO(); let cells="";
      for(let i=0;i<off;i++) cells+=`<span class="x"></span>`;
      for(let d=1; d<=dim; d++){ const iso=`${vy}-${pad(vm+1)}-${pad(d)}`; const dis=opts.max&&iso>opts.max;
        cells+=`<button data-d="${iso}" class="${iso===ti?"today":""} ${iso===val?"on":""}" ${dis?"disabled":""}>${d}</button>`; }
      html+=`<div class="cal-h"><button class="nav" data-nav="-1" aria-label="Previous month">‹</button>
          <span class="t ${opts.dob?"tap":""}" ${opts.dob?'data-ymode="1"':""}>${MONTHS[vm]} ${vy}${opts.dob?" ▾":""}</span>
          <button class="nav" data-nav="1" aria-label="Next month">›</button></div>
        <div class="cal-w"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
        <div class="cal-g">${cells}</div>`;
      if(!opts.dob) html+=`<button class="big ghost" data-today="1" style="min-height:56px;font-size:19px;margin-top:12px">📍 Today</button>`;
    }
    html+=`<button class="big ghost" data-cancel="1" style="min-height:52px;font-size:18px;margin-top:8px">Cancel</button>`;
    $("#pop").innerHTML=html;
  };
  draw(); $("#popBg").classList.add("on");
  $("#pop").onclick=e=>{
    const b=e.target.closest("button,[data-ymode]"); if(!b) return;
    if(b.dataset.nav){ vm+=+b.dataset.nav; if(vm<0){vm=11;vy--} if(vm>11){vm=0;vy++} draw(); }
    else if(b.dataset.ymode){ mode="years"; draw(); }
    else if(b.dataset.y){ vy=+b.dataset.y; mode="months"; draw(); }
    else if(b.dataset.m!==undefined){ vm=+b.dataset.m; mode="days"; draw(); }
    else if(b.dataset.d){ closePop(); onPick(b.dataset.d); }
    else if(b.dataset.today){ closePop(); onPick(todayISO()); }
    else if(b.dataset.cancel){ closePop(); }
  };
}
function openTimePop(val,onPick,title){
  let [h,m]=val?val.split(":").map(Number):[null,null];
  const groups=[["🌅 Morning",[6,7,8,9,10,11]],["☀️ Afternoon",[12,13,14,15,16,17]],["🌆 Evening",[18,19,20,21,22,23]],["🌙 Night",[0,1,2,3,4,5]]];
  const short=x=>`${x%12||12}`;
  const draw=()=>{
    $("#pop").innerHTML=`<h2 style="margin:0 0 4px">🕒 ${esc(title||"Pick a time")}</h2>
      <div class="tp-big">${h===null?"--:--":time12(`${pad(h)}:${pad(m||0)}`)}</div>
      <div class="hint" style="text-align:center;font-size:16px">${h===null?"1. Tap the hour":"2. Tap the minutes"}</div>
      ${groups.map(g=>`<div class="tp-sec">${g[0]} <span style="font-weight:500">(${g[1][0]<12?"AM":"PM"})</span></div><div class="tpg">${g[1].map(x=>`<button data-h="${x}" class="${x===h?"on":""}">${short(x)}</button>`).join("")}</div>`).join("")}
      <div class="tp-sec">Minutes</div>
      <div class="tpm">${[0,15,30,45].map(x=>`<button data-m="${x}" class="${h!==null&&x===m?"on":""}">:${pad(x)}</button>`).join("")}</div>
      <button class="big trip" data-done="1" style="min-height:60px;font-size:21px"><span class="em">✅</span>Done</button>
      <button class="big ghost" data-cancel="1" style="min-height:52px;font-size:18px;margin-top:8px">Cancel</button>`;
  };
  draw(); $("#popBg").classList.add("on");
  $("#pop").onclick=e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.h){ h=+b.dataset.h; if(m===null) m=0; draw(); }
    else if(b.dataset.m!==undefined){ if(h===null){ toast("👆 Tap the hour first"); return; } m=+b.dataset.m; closePop(); onPick(`${pad(h)}:${pad(m)}`); }
    else if(b.dataset.done){ if(h===null){ toast("👆 Tap the hour first"); return; } closePop(); onPick(`${pad(h)}:${pad(m||0)}`); }
    else if(b.dataset.cancel){ closePop(); }
  };
}
// a tappable box that opens the right pop-up
function dtBoxHTML(id,type,val,ph){
  const em=type==="date"?"📅":"🕒";
  const txt = val ? (type==="date"? (()=>{ const d=parseISO(val); return `${DAY3[d.getDay()]} ${MON3[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; })() : time12(val)) : "";
  return `<button class="dtbox ${val?"set":""}" id="${id}" type="button"><span class="em">${em}</span>${val?esc(txt):`<span class="ph">${esc(ph||"Tap to pick")}</span>`}<span class="chev">›</span></button>`;
}
// state[key] holds the value; box re-renders itself after a pick
function bindDT(id,type,state,key,opts={},after){
  const el=$("#"+id); if(!el) return;
  el.onclick=e=>{ e.stopPropagation();
    const done=v=>{ state[key]=v; el.outerHTML=dtBoxHTML(id,type,v,opts.ph); bindDT(id,type,state,key,opts,after); after&&after(); };
    const fresh=()=>{ if(type==="date") openDatePop(state[key],done,opts); else openTimePop(state[key],done,opts.title); };
    const items=opts.suggest?opts.suggest():[];
    if(items.length) openSuggestPop(`${type==="date"?"📅":"🕒"} ${esc(opts.title||"")}`,items,it=>{ if(opts.onSuggest) opts.onSuggest(it); done(it.value); },fresh,type==="date"?"📅 Pick another day":"🕒 Pick another time",state[key]);
    else fresh();
  };
}

const TEEN_OK=["Hourly Respite","Work Related Child Care","Homemaking","Community Support Aide"];

  const L=svcList();

function abdMatches(qn,words,taken){
  if(!ABD||qn.length<2) return [];
  const out=[];
  for(const d of ABD){
    let nameHit=false, ok=true;
    for(const w of words){ if(d.nt.some(h=>h.startsWith(w))){ nameHit=true; continue; } if(!d.ot.some(h=>h.startsWith(w))){ ok=false; break; } }
    if(!ok||!nameHit) continue;

    if(taken.has(taNorm(fill))) continue;
    const nm=taNorm(d.l+" "+d.f), allName=words.every(w=>d.nt.some(h=>h.startsWith(w)));

function taMatches(q){ const qn=taNorm(q).replace(/^dr /,""), words=qn.split(" ").filter(Boolean);
  const mine=(data.settings.clinics||[]).map(c=>({n:c.name,a:c.address,km:c.km,em:"⭐",mine:1}));
  taMatches.more=0;
  if(!qn) return mine.slice(-6).reverse();
  if(qn.length<2) return [];
  const all=mine.concat(taAll().filter(x=>!mine.some(m=>taNorm(m.n)===taNorm(x.fill||x.n))));
  const sc=x=>{ const nm=taNorm(x.n).replace(/^dr /,""), hay=(x.doc?nm:nm+" "+taNorm(x.a)).split(" ");
    if(!words.every(w=>hay.some(h=>h.startsWith(w)))) return -1;

  const hits=all.map(x=>[sc(x),x]).filter(y=>y[0]>=0);

// the agreement year runs 12 months from the start date (or Jan 1 if no date is set)
function agreementYear(){
  const st=data.settings, t=parseISO(todayISO());
  let s0;
  if(st.agreementStart){ const a=parseISO(st.agreementStart); s0=new Date(t.getFullYear(),a.getMonth(),a.getDate()); if(s0>t) s0=new Date(t.getFullYear()-1,a.getMonth(),a.getDate()); }
  else s0=new Date(t.getFullYear(),0,1);
  const e0=new Date(s0.getFullYear()+1,s0.getMonth(),s0.getDate()); e0.setDate(e0.getDate()-1);
  const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  return {from:iso(s0),to:iso(e0),label:`${MON3[s0.getMonth()]} ${s0.getDate()}, ${s0.getFullYear()} – ${MON3[e0.getMonth()]} ${e0.getDate()}, ${e0.getFullYear()}`};
}
function limitCard(kind){
  const st=data.settings, Y=agreementYear(), inY=x=>x.date>=Y.from&&x.date<=Y.to;
  let used, lim, unit;
  if(kind==="resp"){ used=data.visits.filter(v=>inY(v)&&!isDaysSvc(svcOf(v))&&/Respite/.test(svcOf(v))).reduce((a,v)=>a+hoursOf(v),0); lim=parseFloat(st.limResp??"240")||0; unit="hours"; }
  else { used=data.appts.filter(inY).length; lim=parseFloat(st.limDoc??"36")||0; unit="appointments"; }
  if(!lim) return "";
  const left=lim-used, pct=Math.min(100,Math.round(used/lim*100)), over=left<0, near=!over&&pct>=80;
  const col=over?"var(--red)":near?"#d97706":"var(--doc)";
  return `<div class="fcard" style="display:block">
      <div class="frow"><span>📊 This agreement year</span><b style="color:${over?"var(--red)":"var(--ink)"}">${fmtH(used)} of ${fmtH(lim)} ${unit}</b></div>
      <div class="bar" style="margin:8px 0 6px"><i style="width:${pct}%;background:${col}"></i></div>
      <div class="hint">${over?`<b style="color:var(--red)">⚠️ ${fmtH(-left)} ${unit} over the limit. Talk to your FSCD worker.</b>`:near?`<b style="color:#b45309">Only ${fmtH(left)} ${unit} left this year.</b>`:`${fmtH(left)} ${unit} left`} · ${esc(Y.label)}</div>
    </div>`;
}

let thumbTimer=null; const thumbCache={};
function thumbPage(kind){ if(kind!=="triple") return 0; const P2=["second","secondRel","secondPhone","secondEmail","language","langHelp","reason","how","more","address"]; const st2=wizSteps(); const cur=st2[Math.min(wiz,st2.length-1)]; return (wiz<st2.length && cur && P2.includes(cur.k))?2:1; }
const thumbKeyOf=kind=>kind+"|"+month+"|"+thumbPage(kind)+"|"+JSON.stringify(kind==="triple"?data.triple:[data.settings,data.appts,data.visits,data.trips]);
function putThumb(box,c){ box.innerHTML=""; box.appendChild(c); const z=document.createElement("span"); z.className="zoom"; z.textContent="🔍"; box.appendChild(z); }
function scheduleThumb(kind){
  clearTimeout(thumbTimer);
  // nothing changed since the last picture: show it right away, no rebuilding
  const box=document.querySelector(`.fthumb[data-preview="${kind}"]`), hit=thumbCache[kind];
  if(box&&hit){ putThumb(box,hit.canvas); if(hit.key===thumbKeyOf(kind)) return; }
  thumbTimer=setTimeout(()=>drawThumb(kind),hit?400:150);
}
async function drawThumb(kind){
  if(!document.querySelector(`.fthumb[data-preview="${kind}"]`)) return;
  const key=thumbKeyOf(kind), want=thumbPage(kind);
  try{
    const lib=await loadPdfJs();
    const bytes=await buildPDF(kind);
    const pdf=await lib.getDocument({data:bytes}).promise;
    const pn=want||pdf.numPages; // the form being filled now
    const page=await pdf.getPage(Math.min(pn,pdf.numPages));
    const v1=page.getViewport({scale:1}); const scale=(216/v1.width);
    const vp=page.getViewport({scale});
    const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
    await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    try{ pdf.destroy(); }catch(_){}
    thumbCache[kind]={key,canvas:c};
    const box2=document.querySelector(`.fthumb[data-preview="${kind}"]`); if(!box2) return;
    putThumb(box2,c);
  }catch(e){ /* offline: keep the placeholder */ }
}

const PDB="fscd-tracker-photos";
function pdb(){ return pdb.p||(pdb.p=new Promise((res,rej)=>{ const r=indexedDB.open(PDB,1); r.onupgradeneeded=()=>r.result.createObjectStore("p"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); }
async function pPut(id,blob){ const db=await pdb(); return new Promise((res,rej)=>{ const tx=db.transaction("p","readwrite"); tx.objectStore("p").put(blob,id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function pGet(id){ try{ const db=await pdb(); return await new Promise(res=>{ const r=db.transaction("p").objectStore("p").get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null); }); }catch(e){ return null; } }
async function pKeys(){ const db=await pdb(); return new Promise(res=>{ const r=db.transaction("p").objectStore("p").getAllKeys(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>res([]); }); }
async function pDel(id){ const db=await pdb(); return new Promise(res=>{ const tx=db.transaction("p","readwrite"); tx.objectStore("p").delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); }
async function photoGC(){ try{ const used=new Set(data.appts.concat(data.trips).flatMap(r=>(r.photos||[]).map(p=>p.id))); for(const k of await pKeys()) if(!used.has(k)) await pDel(k); }catch(e){} }
function shrink(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{ const M=1600, k=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight)); const c=document.createElement("canvas"); c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/jpeg",0.72); };
  im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("img")); }; im.src=url; }); }
const PKIND={parking:["🅿️","Parking"],meals:["🍽️","Meals"],hotel:["🛏️","Hotel"]};
const camBtn=k=>`<button class="cam" data-cam="${k}" aria-label="Photo of the ${PKIND[k][1].toLowerCase()} receipt">📷<span class="cn"></span></button>`;
const photoCount=list=>list.reduce((n,r)=>n+((r.photos||[]).length),0);
function photoCtl(photos,onAdd){
  const sh=$("#sheet"), box=sh.querySelector(".pbox");
  const picker=document.createElement("input"); picker.type="file"; picker.accept="image/*"; picker.style.display="none"; sh.appendChild(picker);
  let kind="parking"; const urls=[];
  const draw=async()=>{
    sh.querySelectorAll("[data-cam]").forEach(b=>{ const n=photos.filter(p=>p.kind===b.dataset.cam).length; b.querySelector(".cn").textContent=n?String(n):""; b.classList.toggle("has",n>0); });
    if(!box) return; urls.splice(0).forEach(u=>URL.revokeObjectURL(u)); box.innerHTML=""; box.style.display=photos.length?"flex":"none";
    for(const p of photos.slice()){ const blob=await pGet(p.id); const d=document.createElement("div"); d.className="pth";
      d.innerHTML=`${blob?`<img alt="Receipt photo">`:`<span class="gone">?</span>`}<span class="pk">${PKIND[p.kind][0]}</span><button class="px" aria-label="Remove photo">✕</button>`;
      if(blob){ const u=URL.createObjectURL(blob), im=d.querySelector("img"); urls.push(u); im.src=u; im.onclick=e=>{ e.stopPropagation(); showPhoto(u,p.kind); }; }
      d.querySelector(".px").onclick=e=>{ e.stopPropagation(); const i=photos.indexOf(p); if(i>=0) photos.splice(i,1); draw(); };
      box.appendChild(d); } };
  sh.querySelectorAll("[data-cam]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); kind=b.dataset.cam; picker.value=""; picker.click(); }));
  picker.onchange=async()=>{ const f=picker.files&&picker.files[0]; if(!f) return;
    try{ toast("📷 Adding…"); const blob=await shrink(f); const id="p"+uid(); await pPut(id,blob); photos.push({id,kind}); await draw(); if(onAdd) onAdd(kind); toast("✅ Photo added"); }
    catch(err){ toast("Couldn't add the photo"); } };
  draw(); return photos;
}
function showPhoto(url,kind){ const P=$("#pop"); P.innerHTML=`<h2>${PKIND[kind][0]} ${PKIND[kind][1]}</h2><img src="${url}" alt="Receipt photo" style="width:100%;border-radius:14px;display:block"><button class="big ghost" id="pClose" style="margin-top:12px">Close</button>`; $("#popBg").classList.add("on"); $("#pClose").onclick=e=>{ e.stopPropagation(); closePop(); }; }
async function savePhotos(list){
  const files=[]; for(const r of list) for(const p of (r.photos||[])){ const b=await pGet(p.id); if(b) files.push(new File([b],`${r.date} ${PKIND[p.kind][1]} receipt ${files.length+1}.jpg`,{type:"image/jpeg"})); }
  if(!files.length) return toast("No photos found");
  if(navigator.canShare&&navigator.canShare({files})){ try{ await navigator.share({files}); }catch(e){} }
  else files.forEach(f=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); });
}

/* ---------- trips ---------- */
const PARK_CAP=10;
function parkClaim(list){ const d={}; list.forEach(t=>{ d[t.date]=(d[t.date]||0)+(+t.parking||0); }); return Object.values(d).reduce((a,v)=>a+Math.min(v,PARK_CAP),0); }
function dayParkOther(date,skipKey){ return data.appts.map(a=>({k:"a:"+a.id,date:a.date,p:+a.parking||0})).concat(data.trips.map(t=>({k:"t:"+t.id,date:t.date,p:+t.parking||0}))).filter(x=>x.date===date&&x.k!==skipKey).reduce((s,x)=>s+x.p,0); }
function parkHint(inp,box,getDate,skipKey){ if(!inp||!box) return;
  const f=()=>{ const v=+inp.value||0, d=getDate(), other=d?dayParkOther(d,skipKey):0;
    if(v>0&&v+other>PARK_CAP){ box.style.display="block"; box.innerHTML=`⚠️ FSCD pays up to $10 a day.<br>${money(Math.max(0,PARK_CAP-other))} of this will be paid.`; } else box.style.display="none"; };
  ["input","change","blur"].forEach(ev=>inp.addEventListener(ev,f)); f(); return f; }
function apptExtras(list){ const L=list.filter(a=>a.long); return {meals:L.reduce((s,a)=>s+(+a.meals||0),0), hotel:L.reduce((s,a)=>s+(+a.hotel||0),0), missing:L.filter(rcptMissing).length}; }
const rcptMissing=a=>!!(a.long&&+a.hotel>0&&!a.hotelReceipt&&!(a.photos||[]).some(p=>p.kind==="hotel"));
function tripsInMonth(){
  const st=data.settings;
  const auto=inMonth(data.appts).map(a=>({key:"a:"+a.id,auto:true,date:a.date,time:a.time,purpose:"Medical appt (round trip)",from:st.home,to:a.address,toName:a.name,km:a.km,parking:a.parking,photos:a.photos}));
  const man=inMonth(data.trips).map(t=>({key:"t:"+t.id,auto:false,date:t.date,time:"",purpose:t.purpose,from:t.from||st.home,to:t.to,toName:t.to,km:t.km,parking:t.parking,photos:t.photos}));
  return auto.concat(man).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
}
function editTripSheet(key){
  const [kind,id]=key.split(":");

  if(!rec) return;
  openSheet(`
    <h2>${kind==="a"?"🏥":"🚗"} ${esc(shortDate(rec.date))}</h2>
    <div class="hint" style="font-size:17px;margin-bottom:6px">${esc(kind==="a"?rec.name:rec.to)}</div>
    <div class="row2">
      <div><div class="lab"><span class="em">🚗</span>Km</div><input id="eKm" inputmode="decimal" value="${esc(rec.km||"")}" maxlength="6"></div>
      <div><div class="lab"><span class="em">🅿️</span>Parking $</div><div class="withcam"><input id="ePark" inputmode="decimal" value="${esc(rec.parking||"")}" placeholder="0" maxlength="6">${camBtn("parking")}</div></div>
    </div>
    <div class="pwarn" id="eParkW" style="display:none"></div>
    <div class="pbox" style="display:none"></div>
    <button class="big trip" id="saveEdit"><span class="em">✅</span>Save</button>
    ${kind==="t"?`<button class="big ghost" id="delTrip"><span class="em">🗑️</span>Delete trip</button>`:`<div class="hint" style="text-align:center;margin-top:10px">To remove it, delete the doctor visit.</div>`}
    <button class="big ghost" data-close>Cancel</button>`);
  suggestInput($("#ePark"),"🅿️ Parking",()=>uniqRecent([...data.appts,...data.trips].filter(x=>String(x.parking||"").trim()).sort(byNewest),x=>String(+x.parking)).map(x=>({label:money(+x.parking),sub:x.name||x.to,value:String(+x.parking),em:"🅿️"})));
  parkHint($("#ePark"),$("#eParkW"),()=>rec.date,key);
  const photos=photoCtl([...(rec.photos||[])]);
  $("#saveEdit").onclick=()=>{ rec.km=$("#eKm").value.trim(); rec.parking=$("#ePark").value.trim(); if(photos.length) rec.photos=photos.slice(); else delete rec.photos; save(); closeSheet(); render(); if(+rec.parking>10) toast("🅿️ FSCD pays up to $10 a day"); else toast("✅ Saved"); };
  if(kind==="t") $("#delTrip").onclick=e=>{ e.stopPropagation(); confirmSheet("🗑️ Delete this trip?",()=>{ data.trips=data.trips.filter(t=>t.id!==id); save(); }); };
}

// remind about a backup when there are records and none was made in the last 30 days
function backupDue(){ if(entryCount()<3) return false; const lb=data.settings.lastBackup; if(!lb) return true; return (parseISO(todayISO())-parseISO(lb))/864e5>30; }
// home-screen backup card: always there; strong when a backup is due, quiet when it's recent
function backupCard(){
  const lb=data.settings.lastBackup, due=backupDue()||(!lb&&entryCount()>0);
  const sub=lb?`Last one: ${shortDate(lb)}`:"Keep your records safe";
  if(due) return `<button class="start" data-act="go-backup" style="margin:12px 0 0"><span class="em">💾</span><span><b>Back up now</b><span>${esc(sub)}</span></span><span class="chev">›</span></button>`;
  return `<button class="start" data-act="go-backup" style="background:var(--card);color:var(--ink);margin:12px 0 0"><span class="em" style="background:var(--blue-soft);color:var(--blue)">💾</span><span><b>Back up</b><span>${esc(lb?"✅ "+sub:sub)}</span></span><span class="chev">›</span></button>`;
}

    const center=(s,cx,yTop,size,font)=>{ s=clean(s); T(s,cx-font.widthOfTextAtSize(s,size)/2,yTop,size,font); };
    // shrink text until it fits in maxLines lines of width max; last resort trims with "..."
    const fitLines=(s,max,maxLines,size,font,min=4.5)=>{ s=clean(s); let L=wrap(s,max,size,font);
      const tooWide=()=>L.some(l=>font.widthOfTextAtSize(l,size)>max);

function loadScript(src){ return new Promise((res,rej)=>{ const t=document.createElement("script"); t.src=src; t.onload=res; t.onerror=rej; document.head.appendChild(t); }); }

    case "print-doc": makeForm("doc"); break;
    case "save-photos-doc": savePhotos(inMonth(data.appts)); break;
    case "save-photos-trip": savePhotos(tripsInMonth()); break;
    case "print-resp": makeForm("resp"); break;
    case "print-trip": makeForm("trip"); break;
    case "print-triple": makeForm("triple"); break;
    case "add-trip": addTripSheet(); break;
    case "bank-help": bankHelp(); break;
    case "wiz-next": wizNext(); break;
    case "wiz-back": wiz=Math.max(0,wiz-1); render(); break;
    case "wiz-restart": wiz=0; render(); break;
    case "copy-tp": navigator.clipboard.writeText(TP_EMAIL).then(()=>toast("📋 Copied"),()=>toast(TP_EMAIL)); break;
    case "start": data.running={date:todayISO(),start:nowHM()}; save(); month=todayISO().slice(0,7); render(); toast("▶️ Started"); break;
    case "stop": { const r=data.running; if(r){ data.visits.push({id:uid(),date:r.date,start:r.start,end:nowHM()}); data.running=null; save(); month=r.date.slice(0,7); render(); toast("✅ Saved"); } break; }
    case "cancel-run": data.running=null; save(); render(); break;
    case "add-clinic": { const n=$("#cName").value.trim(), a=$("#cAddr").value.trim(); if(!n){ toast("Type the doctor or hospital"); return; } data.settings.clinics.push({id:uid(),name:n,address:a,km:($("#cKm").value||"").trim()}); save(); render(); toast("✅ Added"); break; }
    case "go-backup": go("setup"); setTimeout(()=>{ const el=document.querySelector('[data-act="backup"]'); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); },120); break;
    case "backup": { data.settings.lastBackup=todayISO(); const code=btoa(unescape(encodeURIComponent(JSON.stringify(data)))); navigator.clipboard.writeText(code).then(()=>{ save(); toast("📋 Copied. Paste into Notes."); },()=>{ $("#restoreBox").value=code; toast("Copy the code in the box"); }); break; }
    case "restore": { try{ const d=JSON.parse(decodeURIComponent(escape(atob($("#restoreBox").value.replace(/\s+/g,""))))); if(!d.settings) throw 0;
        const doIt=()=>{ data=normalize(d); save(); closeSheet(); render(); toast("♻️ Restored"); };
        if(entryCount()){ openSheet(`<h2>♻️ Replace what's on this phone?</h2><div class="hint" style="font-size:17px;margin-bottom:6px">The ${entryCount()} entries here now will be swapped for the backup.</div><button class="big blue" id="yesRestore"><span class="em">♻️</span>Restore</button><button class="big ghost" data-close>Keep</button>`); $("#yesRestore").onclick=doIt; }
        else doIt();
      }catch(err){ toast("That code didn't work"); } break; }
  }
});
document.addEventListener("input", e=>{
  const el=e.target;
  if(el.dataset.f){ data.settings[el.dataset.f]=el.value; save(); if(el.dataset.f==="service") render(); }
  if(el.hasAttribute("data-req")) el.classList.toggle("need",!el.value.trim());
  if(el.dataset.wage){ data.settings.wages=data.settings.wages||{}; data.settings.wages[el.dataset.wage]=el.value; save(); }
  if(el.dataset.w){ data.settings.worker[el.dataset.w]=el.value; save(); }
});


render(); iconize(document.body);
// ask the phone not to clear this app's data, and keep a copy of the app for when there's no signal
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
try{ if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost") && window.top===window) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
window.__test = { go, data:()=>data, setData:d=>{data=normalize(d);save();render();}, setMonth:m=>{month=m;render();}, buildPDF, faq:FAQ, loadPdfJs };
})();
